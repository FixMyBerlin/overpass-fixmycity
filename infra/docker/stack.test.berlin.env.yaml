# Berlin-focused test profile for constrained local machines.
# Runtime production target remains Germany; use this profile for fast local validation only.

# Host paths
OVERPASS_DATA_ROOT: "./.local/overpass-data-berlin"
TRAEFIK_ACME_ROOT: "./.local/traefik-berlin"

# Overpass runtime behavior
OVERPASS_META: "yes"
OVERPASS_MODE: "init"
OVERPASS_STOP_AFTER_INIT: "false"
OVERPASS_RATE_LIMIT: "2"
# Minutely candidate feed under evaluation for Germany target:
# https://download.openstreetmap.fr/replication/europe/germany/minute/
OVERPASS_DIFF_URL: "https://download.openstreetmap.fr/replication/europe/germany/minute/"
OVERPASS_ALLOW_DUPLICATE_QUERIES: "yes"
OVERPASS_UPDATE_SLEEP: "60"
OVERPASS_COMPRESSION: "gz"
OVERPASS_RULES_LOAD: "10"

# Import source and preprocess hooks
OVERPASS_PLANET_URL: "https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf"
OVERPASS_PLANET_SOURCE_FORMAT: "auto"
OVERPASS_PLANET_PREPROCESS: "mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf"
OVERPASS_DIFF_PREPROCESS: ""

# OAuth defaults (disabled for local Berlin profile)
USE_OAUTH_COOKIE_CLIENT: "no"
OVERPASS_OAUTH_USER: "dev-team@fixmycity.de"
OVERPASS_OAUTH_OSM_HOST: "https://www.openstreetmap.org"
OVERPASS_OAUTH_CONSUMER_URL: "https://osm-internal.download.geofabrik.de/get_cookie"

# Public routing and TLS
OVERPASS_DOMAIN: "private-overpass.fixmycity.de"
OVERPASS_ALLOWED_CIDRS: "0.0.0.0/0,::/0"
TRAEFIK_ACME_EMAIL: "dev-team@fixmycity.de"
TRAEFIK_LOG_LEVEL: "WARN"
TRAEFIK_API_INSECURE: "false"
TRAEFIK_DASHBOARD: "false"
TRAEFIK_READ_TIMEOUT: "300s"
TRAEFIK_WRITE_TIMEOUT: "300s"
TRAEFIK_DIAL_TIMEOUT: "100s"

# Runtime test defaults
OVERPASS_TEST_BASE_URL: "http://127.0.0.1:8080"
OVERPASS_TEST_REPLICATION_WAIT_MS: "65000"
