---
- name: Update apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
  when: apt_upgrade_enabled | bool

- name: Install baseline host packages
  ansible.builtin.apt:
    name: "{{ apt_packages_common }}"
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname_value }}"
  when: hostname_value | length > 0

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot host after updates
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after package updates"
    reboot_timeout: 1800
  when:
    - reboot_if_required | bool
    - reboot_required_file.stat.exists
