---
- name: Ensure operations group exists
  ansible.builtin.group:
    name: "{{ overpass_ops_group }}"
    system: true
    state: present

- name: Add operator user to docker group
  ansible.builtin.user:
    name: "{{ overpass_operator_user }}"
    groups: docker
    append: true
  when: overpass_operator_user | length > 0

- name: Ensure repository and data root exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ overpass_ops_group }}"
    mode: "0755"
  loop:
    - "{{ overpass_repo_root }}"
    - "{{ overpass_data_root }}"

# The container runs as uid/gid 10001 (b1tw153/overpass-api).
- name: Ensure Overpass data directories exist
  ansible.builtin.file:
    path: "{{ overpass_data_root }}/{{ item }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"
  loop: [db, diff, backup]

- name: Ensure Traefik ACME directory exists
  ansible.builtin.file:
    path: "{{ overpass_data_root }}/traefik"
    state: directory
    owner: root
    group: root
    mode: "0700"
